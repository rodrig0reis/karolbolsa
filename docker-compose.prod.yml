services:
  db:
    image: postgres:15-alpine
    container_name: karol_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - karol_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - karol_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: karol_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=${AUTH_URL}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - AUTH_TRUST_HOST=${AUTH_TRUST_HOST}
      - WHATSAPP_NUMBER=${WHATSAPP_NUMBER}
      - INSTAGRAM_URL=${INSTAGRAM_URL}
    volumes:
      - karol_uploads:/app/public/uploads
    networks:
      - karol_network

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: karol_migrate
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"
    networks:
      - karol_network

networks:
  karol_network:
    driver: bridge

volumes:
  karol_postgres_data:
  karol_uploads:
